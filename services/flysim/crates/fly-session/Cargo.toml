[package]
name = "fly-session"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "The lockstep session coordinator, its phase machine and a synthetic composition over flybus."

[lib]
name = "fly_session"
path = "src/lib.rs"

# One binary, one role per subcommand. `implementation.md` section 2 allows worker
# executables to be subcommands of one binary rather than separate crates, and the launcher
# starts this one with `agent` or `environment` for a participant in its own process.
[[bin]]
name = "fly-session"
path = "src/bin/fly-session.rs"

[features]
# The LIF tick on the GPU (GPU-02), a passthrough to `flybrain-core/cuda`. Compiling it in does not
# turn it on: the agent worker attaches the backend only when `FLY_LIF_CUDA=1` reaches it.
cuda = ["flybrain-core/cuda"]

[dependencies]
# The domain contract (scalars, payloads, canonical digests, the trace format) and the bus.
# Everything else this crate needs is std or Tokio.
fly-session-types = { path = "../fly-session-types" }
flybus = { path = "../flybus" }
# AGENT-01: the legacy agent worker is an adapter over the existing neural core (LIF kernel,
# plasticity, retina, fixed readout, checkpoint chunks). Pure Rust, no emulator.
# ENV-01: the legacy Game Boy environment worker drives the binjgb emulator through
# flybrain-gb's safe wrapper, and flybrain-core's frozen envelope layout reads and writes the
# world's half of a FLYSIM01 checkpoint.
flybrain-core = { path = "../flybrain-core" }
flybrain-gb = { path = "../flybrain-gb" }
# The toy connectome fixture is written as gzipped `.binz` arrays, the dataset loader's format.
flate2 = { workspace = true }
# STATE-02: the FLYSIM01 store and the sugar journal, the same code the legacy loop writes with.
flysim-store = { path = "../flysim-store" }

serde_json = { workspace = true }
# PR_SET_PDEATHSIG for worker processes (a child never outlives its parent, systemd or not).
libc = "0.2"
# `rt-multi-thread` is not only for the tests: a worker process and a dedicated-thread
# worker each build their own runtime sized to the launcher's thread allocation.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
