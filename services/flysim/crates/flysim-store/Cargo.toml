[package]
name = "flysim-store"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "The FLYSIM01 checkpoint store (envelope, generations, milestone archives) and the sugar journal, shared by flysim and the session runtime."

[lib]
name = "flysim_store"
path = "src/lib.rs"

# STATE-02: `flysim` (the legacy loop) and `fly-session` (the session runtime) write and read
# the same store, so the code lives here once and both link it. No dependency on either of
# them, and nothing async: the writer threads belong to the callers.
[dependencies]
flybrain-core = { path = "../flybrain-core" }
flybrain-gb = { path = "../flybrain-gb" }

anyhow = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
