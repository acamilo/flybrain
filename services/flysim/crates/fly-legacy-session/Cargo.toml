[package]
name = "fly-legacy-session"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "The live fly's composition on the session framework: the pokered-macros-v1 task and executor, the FLYSIM01 import, the parity harness against the legacy loop's FLY_TRACE, and the flysim-session service."

[lib]
name = "fly_legacy_session"
path = "src/lib.rs"

# SERVE-01: the session runtime as the live service, a drop-in for `flysim`.
[[bin]]
name = "flysim-session"
path = "src/bin/flysim-session.rs"

# SHADOW-01: the session runtime run beside the live fly (`infra/units/flyshadow.service`).
[[bin]]
name = "fly-shadow"
path = "src/bin/fly-shadow.rs"

[dependencies]
# The session framework and its legacy workers (AGENT-01, ENV-01).
fly-session = { path = "../fly-session" }
flybus = { path = "../flybus" }
# The unchanged legacy engine the task and executor run: flysim's macro layer, flybrain-gb's
# palette, macro executor, PokeState, reward adapter and ratchet, read through MEM-01's image.
# flysim is a library dependency only; nothing here changes the service it builds. SERVE-01's
# `flysim-session` runs the session behind flysim's own listeners (`flysim::serve`).
flysim = { path = "../flysim" }
flybrain-gb = { path = "../flybrain-gb" }
flybrain-core = { path = "../flybrain-core" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
# The service entry point (SERVE-01), with flysim's own versions of each.
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# CTRL-01: the service contracts with the control API on the bus (`tests/service_parity.rs`).
fly-control-edge = { path = "../fly-control-edge" }
tempfile = "3"
axum = "0.8"
futures-util = "0.3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
